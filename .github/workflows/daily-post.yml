name: daily-post

# 毎朝8時(JST)に事業紹介カードを1本、Instagramストーリーに投稿する。
# GitHubの定時実行は遅延・スキップが起きるため、朝に3回チャンスを設け、
# output/last_posted.txt の対象日マーカーで二重投稿を防ぐ。
on:
  schedule:
    - cron: "0 23 * * *" # 8:00 JST(1回目)
    - cron: "25 23 * * *" # 8:25 JST(2回目・保険)
    - cron: "50 23 * * *" # 8:50 JST(3回目・保険)
  workflow_dispatch: # 手動実行(テスト用)
    inputs:
      dry_run:
        description: "お試し実行(投稿せずカード選択の確認のみ)"
        type: boolean
        default: false
      card:
        description: "カード番号を指定して投稿(空欄=日付ローテーション)"
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 今日の分が投稿済みかチェック(定時実行のみ。手動実行は常に実行)
        id: check
        run: |
          target=$(TZ=Asia/Tokyo date +%F)
          echo "target=$target" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] \
             && [ -f output/last_posted.txt ] \
             && [ "$(cat output/last_posted.txt)" = "$target" ]; then
            echo "対象日($target)は投稿済みのためスキップします。"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.proceed == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存関係をインストール
        if: steps.check.outputs.proceed == 'true'
        run: pip install -r requirements.txt

      - name: カード選択の確認(お試し実行)
        if: steps.check.outputs.proceed == 'true' && github.event.inputs.dry_run == 'true'
        run: python -m src.main select ${{ github.event.inputs.card && format('--card {0}', github.event.inputs.card) || '' }}

      - name: Instagram ストーリーへ投稿
        id: post_ig
        if: steps.check.outputs.proceed == 'true' && github.event.inputs.dry_run != 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python -m src.main post ${{ github.event.inputs.card && format('--card {0}', github.event.inputs.card) || '' }}

      - name: 投稿済みマーカーを記録(以降の定時実行をスキップさせる)
        if: steps.post_ig.outcome == 'success' && github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 先にリモートと同期してからマーカーを書く(逆順だと unstaged changes で失敗する)
          git pull --rebase --autostash
          echo "${{ steps.check.outputs.target }}" > output/last_posted.txt
          git add output/last_posted.txt
          git commit -m "chore: 投稿済みマーカー更新"
          git push || { git pull --rebase --autostash && git push; }
