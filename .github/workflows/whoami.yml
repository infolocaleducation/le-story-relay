name: whoami

# セットアップ補助: IG_ACCESS_TOKEN Secret を登録した後にこれを手動実行すると、
# トークンで管理しているFBページと Instagram ビジネスアカウントID の一覧が
# ログに表示される。表示された IG_USER_ID を Secrets に登録する。

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: FBページとIGアカウントIDを表示
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python -m src.main whoami
